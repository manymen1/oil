[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oiltradingbot"
version = "0.1.0"
description = "Standalone oil observation, extraction, and research application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "beautifulsoup4==4.15.0",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
databento = ["databento==0.86.0"]
ibkr = ["ibapi @ https://interactivebrokers.github.io/downloads/twsapi_macunix.1050.02.zip#sha256=673129e5cba58c4d77bc40647265f84ea42f605eccf88fa4c1221d62d12454f3&subdirectory=IBJts/source/pythonclient"]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
oilbot = "oilbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
